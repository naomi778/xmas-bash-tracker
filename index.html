<meta name="theme-color" content="#15221A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xmas Bash">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
<style>
:root{--bg:#0E1712;--surface:#15221A;--border:#25382C;--text:#F8F6F0;--text-soft:#A7B5AB;--accent:#E2B93B;--green:#66BB6A;--red:#E5484D;--amber:#F5A623;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:radial-gradient(120% 60% at 50% 0%,rgba(226,185,59,.07),transparent 60%),var(--bg);background-color:var(--bg);min-height:100vh;color:var(--text);overscroll-behavior:none}
#loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-screen p{font-size:15px;color:var(--text-soft)}
#app{display:none}
header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px 12px;padding-top:calc(14px + var(--safe-top));display:flex;align-items:center;justify-content:space-between}
.header-left h1{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.3px}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:middle;animation:pulse 2s ease-in-out infinite}
.live-dot.offline{background:#666;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.header-right{display:flex;align-items:center;gap:8px}
.mode-toggle{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;border:1px solid var(--border)}
.mode-btn{padding:8px 14px;border-radius:8px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:var(--text-soft);cursor:pointer;transition:all .15s}
.mode-btn.active{background:var(--accent);color:#1A1A1A}
.gear-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:transparent;font-size:17px;cursor:pointer;color:var(--text-soft);transition:background .15s;flex-shrink:0}
.gear-btn:active{background:rgba(255,255,255,.08)}
body:not(.cashier-mode) .gear-btn{display:flex}
.cat-bar{display:flex;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:8px 14px;border-radius:99px;border:1px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:var(--text-soft);cursor:pointer;transition:all .15s;white-space:nowrap}
.cat-btn.active{background:var(--accent);border-color:var(--accent);color:#1A1A1A}
.cat-btn.uncat-btn{border-color:rgba(245,166,35,.4);color:var(--amber)}
.cat-btn.uncat-btn.active{background:var(--amber);border-color:var(--amber);color:#1A1A1A}
.alert-bar{position:fixed;bottom:0;left:0;right:0;z-index:99;padding:13px 20px;padding-bottom:calc(13px + var(--safe-bottom));background:var(--red);color:#fff;font-size:14px;font-weight:600;text-align:center;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.alert-bar.visible{transform:translateY(0)}
.alert-bar.warn{background:#B85C00}
.items-container{padding:0 0 calc(60px + var(--safe-bottom))}
body.cashier-mode .item-row{display:flex;align-items:center;padding:15px 20px;gap:14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;position:relative;overflow:hidden;-webkit-user-select:none;user-select:none}
body.cashier-mode .item-row:active{background:rgba(255,255,255,.04)}
body.cashier-mode .item-row.out-of-stock{opacity:.45}
body.cashier-mode .item-row.low-stock .item-count{color:var(--amber)}
body.cashier-mode .item-row.out-of-stock .item-count{color:var(--red)}
body.cashier-mode .item-name-wrap{flex:1;min-width:0}
body.cashier-mode .item-name{font-size:17px;font-weight:500;color:var(--text);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.cashier-mode .item-cat-tag{font-size:13px;font-weight:400;color:var(--text-soft);margin-top:2px}
body.cashier-mode .item-count{font-family:'Outfit',sans-serif;font-size:28px;font-weight:700;color:var(--text);min-width:44px;text-align:right;flex-shrink:0;transition:transform .15s}
body.cashier-mode .item-count.bump{animation:bump .2s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
.ripple{position:absolute;border-radius:50%;background:rgba(226,185,59,.2);transform:scale(0);animation:ripple-anim .5s ease-out forwards;pointer-events:none}
@keyframes ripple-anim{to{transform:scale(4);opacity:0}}
.item-card{background:var(--surface);border-radius:16px;border:1px solid var(--border);overflow:hidden;margin:8px 16px}
.item-card.low-stock{border-color:rgba(245,166,35,.4)}
.item-card.out-of-stock{border-color:rgba(229,72,77,.4);opacity:.7}
.item-card .item-main{display:flex;align-items:center;padding:14px 16px;gap:12px}
.item-card .item-code{font-size:13px;font-weight:500;color:var(--text-soft);background:var(--bg);padding:3px 8px;border-radius:6px;flex-shrink:0}
.item-card .item-name-wrap{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.item-card .item-name{font-size:17px;font-weight:500;color:var(--text)}
.item-card .item-cat-tag{font-size:13px;font-weight:400;color:var(--text-soft)}
.item-card input.item-name-input{border:none;background:transparent;outline:none;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;color:var(--text);width:100%;padding:0;border-bottom:1.5px dashed var(--border)}
.item-card input.item-name-input:focus{border-bottom-color:var(--accent)}
.item-card .item-count{font-family:'Outfit',sans-serif;font-size:30px;font-weight:800;color:var(--text);min-width:48px;text-align:right;flex-shrink:0}
.item-card .item-count.low{color:var(--amber)}
.item-card .item-count.zero{color:var(--red)}
.item-card .item-count.bump{animation:bump .2s ease}
.item-card input.count-input{font-family:'Outfit',sans-serif;font-size:30px;font-weight:800;text-align:right;border:none;background:transparent;outline:none;width:70px;padding:0;-moz-appearance:textfield;border-bottom:2px dashed var(--border);color:var(--text)}
.item-card input.count-input:focus{border-bottom-color:var(--accent)}
.item-card input.count-input::-webkit-outer-spin-button,.item-card input.count-input::-webkit-inner-spin-button{-webkit-appearance:none}
.item-controls{display:flex;border-top:1px solid var(--border)}
.ctrl-btn{flex:1;border:none;background:transparent;padding:14px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--text);user-select:none;-webkit-user-select:none;transition:background .12s}
.ctrl-btn.minus{border-right:1px solid var(--border);color:var(--red);font-size:22px}
.ctrl-btn.plus{color:var(--green);font-size:22px}
.ctrl-btn.minus:active{background:rgba(229,72,77,.15)}
.ctrl-btn.plus:active{background:rgba(102,187,106,.15)}
.ctrl-btn.delete{flex:0 0 56px;color:var(--red);font-size:16px;border-left:1px solid var(--border)}
.ctrl-btn.delete:active{background:rgba(229,72,77,.15)}
.status-badge{font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.3px;flex-shrink:0}
.badge-low{background:rgba(245,166,35,.2);color:var(--amber)}
.badge-out{background:rgba(229,72,77,.2);color:var(--red)}
.badge-ok{display:none}
.confirm-row{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:rgba(229,72,77,.08);animation:fadeIn .15s ease}

.confirm-label{flex:1;font-size:14px;font-weight:500;color:var(--red)}

.confirm-no{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--text-soft);cursor:pointer}
.toast{position:fixed;top:calc(80px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-10px);background:var(--accent);color:#1A1A1A;padding:10px 20px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.add-fab{position:fixed;bottom:calc(20px + var(--safe-bottom));right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#1A1A1A;font-size:26px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(226,185,59,.4);transition:transform .15s,bottom .3s cubic-bezier(.32,.72,0,1);z-index:98}
.add-fab:active{transform:scale(.93)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + var(--safe-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1)}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 20px}
.modal-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;margin-bottom:18px;color:var(--text)}
.form-field{margin-bottom:14px}
.form-field label{display:block;font-size:13px;font-weight:500;color:var(--text-soft);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.form-field input,.form-field select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);outline:none;-webkit-appearance:none}
.form-field input:focus,.form-field select:focus{border-color:var(--accent)}
.form-row{display:flex;gap:10px}
.form-row .form-field{flex:1}
.btn-primary{width:100%;padding:16px;background:var(--accent);color:#1A1A1A;border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;transition:opacity .15s}
.btn-primary:active{opacity:.8}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-soft)}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:15px}
.reset-btn{background:none;border:none;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text-soft);padding:14px 20px;display:block;margin:0 auto;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* REORDER */
.reorder-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.reorder-info{font-size:13px;color:var(--text-soft)}
.reorder-toggle-btn{font-size:13px;font-weight:700;border:none;background:transparent;color:var(--accent);cursor:pointer;padding:6px 12px;border-radius:8px;font-family:'DM Sans',sans-serif}

.reorder-hint{font-size:13px;color:var(--accent);font-weight:600}

.reorder-done-btn:active{background:rgba(226,185,59,.35)}
.drag-handle{display:none;font-size:20px;color:var(--accent);background:rgba(226,185,59,.14);border:1px solid rgba(226,185,59,.35);border-radius:8px;cursor:grab;padding:6px 8px;margin-right:2px;flex-shrink:0;user-select:none;-webkit-user-select:none;align-items:center;justify-content:center;line-height:1;min-width:38px;min-height:38px;touch-action:none;transition:background .12s,transform .12s}
.drag-handle:active{cursor:grabbing;background:rgba(226,185,59,.3);transform:scale(.94)}
#items-list.reordering .drag-handle{display:flex}
#items-list.reordering .item-controls{display:none!important}
#items-list.reordering .cat-tag-row{display:none!important}
#items-list.reordering input.count-input{visibility:hidden}
#items-list.reordering .status-badge{visibility:hidden}
#items-list.reordering .item-card{user-select:none;-webkit-user-select:none}
.sortable-ghost{opacity:.25!important;background:rgba(226,185,59,.08)!important;border-color:rgba(226,185,59,.4)!important}
.sortable-chosen{box-shadow:0 8px 28px rgba(0,0,0,.5)}
/* CASHIER SOLD-OUT SECTION */
.sold-out-divider{display:flex;align-items:center;gap:10px;padding:14px 20px 10px;font-size:12px;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:.6px;-webkit-user-select:none;user-select:none}
.sold-out-divider::before,.sold-out-divider::after{content:"";flex:1;height:1px;background:var(--border)}
body.cashier-mode .item-row{transition:background .12s,opacity .25s ease}
/* CATEGORY TAGS */
.cat-tag-row{border-top:1px solid var(--border);padding:8px 16px}
.cat-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--text-soft);background:var(--bg);padding:4px 10px;border-radius:99px;border:1px solid var(--border);cursor:pointer;transition:border-color .15s,background .15s;user-select:none;-webkit-user-select:none}
.cat-tag:active{background:rgba(255,255,255,.06)}
.cat-tag.uncat{color:var(--amber);border-color:rgba(245,166,35,.35);background:rgba(245,166,35,.07)}
.cat-picker-dropdown{margin-top:6px;background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;animation:fadeIn .12s ease}
.cat-picker-opt,.cat-picker-cancel{padding:11px 14px;font-size:14px;font-weight:500;cursor:pointer;border-bottom:1px solid var(--border);color:var(--text);transition:background .12s;display:block;width:100%;text-align:left;background:transparent;border-left:none;border-right:none;border-top:none;font-family:'DM Sans',sans-serif}
.cat-picker-opt:last-of-type{border-bottom:none}
.cat-picker-opt:active,.cat-picker-cancel:active{background:rgba(255,255,255,.06)}
.cat-picker-cancel{color:var(--text-soft);font-size:13px;border-bottom:none}
/* CATEGORY MANAGER */
.cat-mgr-sheet{max-height:85vh;overflow-y:auto}
.cat-mgr-row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--border)}
.cat-mgr-row:last-child{border-bottom:none}
.cat-mgr-drag{font-size:17px;color:var(--accent);background:rgba(226,185,59,.14);border:1px solid rgba(226,185,59,.35);border-radius:7px;cursor:grab;flex-shrink:0;user-select:none;-webkit-user-select:none;padding:5px 7px;line-height:1;display:flex;align-items:center;justify-content:center;min-width:32px;min-height:32px;touch-action:none;transition:background .12s,transform .12s}
.cat-mgr-drag:active{cursor:grabbing;background:rgba(226,185,59,.3);transform:scale(.94)}
.cat-mgr-icon{font-size:20px;flex-shrink:0}
.cat-mgr-name{flex:1;font-size:15px;font-weight:500;color:var(--text)}
.cat-mgr-count{font-size:12px;color:var(--text-soft);flex-shrink:0;min-width:40px;text-align:right}
.cat-mgr-act{border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;padding:5px 8px;border-radius:6px;flex-shrink:0;transition:background .12s}

.cat-mgr-act.rename:active{background:rgba(226,185,59,.12)}

.cat-mgr-act.cancel-rename{color:var(--text-soft)}
.cat-rename-row{flex-wrap:wrap;gap:8px;padding:10px 2px}
.cat-emoji-btn{font-size:20px;flex-shrink:0;cursor:pointer;background:var(--bg);padding:5px 8px;border-radius:8px;border:1px solid var(--border);transition:border-color .15s}
.cat-emoji-btn:active{border-color:var(--accent)}
.cat-rename-input{flex:1;min-width:100px;border:none;border-bottom:1.5px dashed var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);outline:none;padding:2px 0}
.cat-rename-input:focus{border-bottom-color:var(--accent)}
.emoji-picker-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px;background:var(--bg);border-radius:10px;margin:6px 0;border:1px solid var(--border);animation:fadeIn .12s ease}
.emoji-opt{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:22px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:border-color .12s,background .12s}
.emoji-opt.sel{border-color:var(--accent);background:rgba(226,185,59,.15)}
.emoji-opt:active{background:rgba(255,255,255,.08)}
.cat-delete-confirm{background:rgba(229,72,77,.1);border-radius:10px;padding:10px 12px;margin:6px 0;animation:fadeIn .12s ease}
.cat-delete-confirm p{font-size:13px;color:var(--red);margin-bottom:8px;line-height:1.4}
.cat-delete-confirm .confirm-row{border-top:none;background:transparent;padding:0;gap:8px}
.cat-add-toggle{display:flex;align-items:center;gap:6px;padding:14px 2px;font-size:14px;font-weight:600;color:var(--accent);cursor:pointer;border-top:1px solid var(--border);margin-top:4px;-webkit-user-select:none;user-select:none}
.cat-add-form{padding:4px 0 0}
.cat-add-label{font-size:12px;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px;display:block}
.cat-add-name-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);outline:none;margin-bottom:8px}
.cat-add-name-input:focus{border-color:var(--accent)}
.btn-add-cat{width:100%;padding:14px;background:var(--accent);color:#1A1A1A;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-add-cat:active{opacity:.8}
.btn-add-cat:disabled{opacity:.5;cursor:not-allowed}
.mgr-done-btn{width:100%;padding:15px;background:var(--surface);color:var(--accent);border:1.5px solid var(--accent);border-radius:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;transition:background .15s}

header{position:sticky}

function escHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

async function boot(){
  if(firebaseConfig.apiKey.startsWith("PASTE")){
    document.getElementById("loading-screen").innerHTML="<p style='color:var(--amber);text-align:center;padding:24px;line-height:1.5'>🎄 Almost there!<br>Paste your Firebase config into index.html<br>(look for PASTE YOUR OWN FIREBASE CONFIG).</p>";
    return;
  }
  try{
    const catQ=query(collection(db,CATS_COL),orderBy("sort_order"));
    const catS=await getDocs(catQ);
    if(catS.empty){
      // Auto-seed default categories on first load
      const batch=writeBatch(db);
      const defaults=[
        {name:"Bakes",icon:"🍪",sort_order:0},
        {name:"Small Bites",icon:"🍟",sort_order:1},
        {name:"Big Bites",icon:"🥗",sort_order:2}
      ];
      defaults.forEach(cat=>{
        const ref=doc(collection(db,CATS_COL));
        batch.set(ref,cat);
      });
      await batch.commit();
      const catS2=await getDocs(catQ);
      cats=catS2.docs.map(d=>({id:d.id,...d.data()}));
    }else{
      cats=catS.docs.map(d=>({id:d.id,...d.data()}));
    }
    rebuildCatIcons();
    const q=query(collection(db,COL),orderBy("sort_order"));
    const s=await getDocs(q);
    items=s.docs.map(d=>({id:d.id,...d.data()}));
    hide("loading-screen");
    show("app");
    render();
    sub();
    subCats();
  }catch(e){
    console.error("Boot failed:",e);
    document.getElementById("loading-screen").innerHTML="<p style='color:var(--red);text-align:center;padding:24px'>Failed to connect.<br>"+escHtml(e.message)+"<br><br>Check internet &amp; refresh.</p>";
  }
}

function sub(){
  const q=query(collection(db,COL),orderBy("sort_order"));
  onSnapshot(q,s=>{
    const n=s.docs.map(d=>({id:d.id,...d.data()}));
    diff(n);items=n;updateAlert();
    document.getElementById("live-dot").classList.remove("offline");
  },()=>{document.getElementById("live-dot").classList.add("offline");});
}

function renderCatBar(){

function diff(newItems){
  if(isReordering)return;
  const list=document.getElementById("items-list");if(!list)return;
  const filt=getFiltered(newItems);
  const curIds=[...list.querySelectorAll("[data-item-id]")].map(e=>e.dataset.itemId);
  const newIds=filt.map(i=>i.id);
  if(curIds.join(",")!==newIds.join(",")){items=newItems;renderItems();return;}
  filt.forEach(item=>{
    const old=items.find(i=>i.id===item.id);if(!old)return;
    if(old.count!==item.count){
      const c=document.getElementById("count-"+item.id);
      if(c){if(c.tagName==="INPUT")c.value=item.count;else c.textContent=item.count;applyCC(c,item);c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");}
      const row=document.getElementById("card-"+item.id)||document.getElementById("row-"+item.id);
      if(row)applyRS(row,item);
    }
    if(old.name!==item.name){const n=document.getElementById("name-"+item.id);if(n){if(n.tagName==="INPUT")n.value=item.name;else n.textContent=item.name;}}
  });
}

function getFiltered(il){
  let out;
  if(activeCat==="all")out=il.slice();
  else if(activeCat==="uncategorised")out=il.filter(i=>!i.category||!cats.find(c=>c.name===i.category));
  else out=il.filter(i=>i.category===activeCat);
  // Cashier view only: push sold-out items to the bottom, keep sort_order within each group.
  // Team Lead view keeps the raw sort_order so reordering stays predictable.
  if(mode==="cashier"&&!isReordering){
    out.sort((a,b)=>{
      const aOut=a.count===0?1:0, bOut=b.count===0?1:0;
      if(aOut!==bOut)return aOut-bOut;
      return (a.sort_order||0)-(b.sort_order||0);
    });
  }
  return out;
}

function applyCC(el,item){
  const low=item.low_threshold||2;
  el.className=(mode==="lead"&&el.tagName==="INPUT")?"item-count count-input":"item-count";
  if(item.count===0)el.classList.add("zero");else if(item.count<=low)el.classList.add("low");
}

function applyRS(el,item){
  const low=item.low_threshold||2;
  el.classList.remove("low-stock","out-of-stock");
  if(item.count===0)el.classList.add("out-of-stock");else if(item.count<=low)el.classList.add("low-stock");
}

window.adjust=async function(id,delta){
  const item=items.find(i=>i.id===id);if(!item)return;
  const prevCount=item.count;
  const nv=Math.max(0,item.count+delta);
  if(nv===item.count){if(delta<0){showToast("Already at 0!");hapticHeavy();}return;}
  item.count=nv;hapticLight();
  const el=document.getElementById("count-"+id);
  if(el){if(el.tagName==="INPUT")el.value=nv;else el.textContent=nv;applyCC(el,item);el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}
  const row=document.getElementById("card-"+id)||document.getElementById("row-"+id);
  if(row)applyRS(row,item);
  updateAlert();
  if(nv===0){hapticHeavy();showToast(item.name+" — Sold Out!");}
  // Cashier view: when an item crosses the sold-out boundary its position changes,
  // so re-render after a beat — the user sees the count land on 0 before it moves down.
  const crossedZero=(nv===0&&prevCount>0)||(nv>0&&prevCount===0);
  if(mode==="cashier"&&crossedZero){setTimeout(()=>{if(mode==="cashier")renderItems();},450);}
  // Send the CHANGE (not the final number) so simultaneous taps from several phones are never lost.
  const ref=doc(db,COL,id);
  try{
    if(delta>0){
      await updateDoc(ref,{count:increment(delta)});
    }else{
      // Minus: Firebase checks the live count first, so two cashiers can never push it below 0.
      await runTransaction(db,async tx=>{
        const snap=await tx.get(ref);
        if(!snap.exists())throw new Error("GONE");
        const cur=snap.data().count||0;
        if(cur+delta<0)throw new Error("SOLD_OUT");
        tx.update(ref,{count:increment(delta)});
      });
    }
  }catch(e){
    if(e.message==="SOLD_OUT"){showToast(item.name+" is already sold out");hapticHeavy();}
    else if(e.message==="GONE"){showToast("Item was removed");}
    else{showToast("Save failed — check connection");item.count=prevCount;renderItems();updateAlert();}
  }
};

window.cashierTap=function(id,ev){
  const row=document.getElementById("row-"+id);
  if(row){const r=row.getBoundingClientRect();const rip=document.createElement("span");rip.className="ripple";const sz=Math.max(r.width,r.height);rip.style.width=rip.style.height=sz+"px";rip.style.left=(ev.clientX-r.left-sz/2)+"px";rip.style.top=(ev.clientY-r.top-sz/2)+"px";row.appendChild(rip);setTimeout(()=>rip.remove(),600);}
  window.adjust(id,-1);
};

  try{await updateDoc(doc(db,COL,id),{count:nv});}catch(e){showToast("Save failed");}
};

window.setName=async function(id,val){

function updateAlert(){
  const bar=document.getElementById("alert-bar");const fab=document.getElementById("add-fab");
  const f=getFiltered(items);
  const out=f.filter(i=>i.count===0).length;
  const low=f.filter(i=>i.count>0&&i.count<=(i.low_threshold||2)).length;
  if(out>0){bar.textContent="⚠ "+out+" item"+(out>1?"s":"")+" sold out";bar.className="alert-bar visible";fab.style.bottom="calc(60px + var(--safe-bottom))";}
  else if(low>0){bar.textContent=low+" item"+(low>1?"s":"")+" running low";bar.className="alert-bar visible warn";fab.style.bottom="calc(60px + var(--safe-bottom))";}
  else{bar.className="alert-bar";fab.style.bottom="calc(20px + var(--safe-bottom))";}
}

function getCatTag(item){
  const catObj=cats.find(c=>c.name===item.category);
  const tag=document.createElement("div");
  if(catObj){
    tag.className="cat-tag";tag.dataset.itemId=item.id;
    tag.textContent=catObj.icon+" "+catObj.name+" ›";
  }else{
    tag.className="cat-tag uncat";tag.dataset.itemId=item.id;
    tag.textContent="⚠️ No category — tap to set ›";
  }
  tag.addEventListener("click",e=>window.toggleCatPicker(item.id,e));
  return tag;
}

      const row=document.createElement("div");

        const ct=document.createElement("div");ct.className="item-cat-tag";ct.textContent=catIcons[item.category]+" "+item.category;nw.appendChild(ct);
      }
      const cnt=document.createElement("span");
      cnt.className="item-count"+(item.count===0?" zero":item.count<=low?" low":"");
      cnt.id="count-"+item.id;cnt.textContent=item.count;
      row.appendChild(nw);row.appendChild(cnt);

    list.innerHTML="";

    }else{
      rbar.className="reorder-bar";
      const info=document.createElement("span");info.className="reorder-info";info.textContent=f.length+" item"+(f.length!==1?"s":"");
      const tog=document.createElement("button");tog.className="reorder-toggle-btn";tog.textContent="⇅ Reorder";tog.addEventListener("click",window.enterReorderMode);
      rbar.appendChild(info);rbar.appendChild(tog);
    }
    list.appendChild(rbar);
    const sl=document.createElement("div");sl.id="sortable-list";
    f.forEach(item=>{
      const low=item.low_threshold||2;
      const card=document.createElement("div");
      card.className="item-card"+(item.count===0?" out-of-stock":item.count<=low?" low-stock":"");
      card.id="card-"+item.id;card.dataset.itemId=item.id;
      // main row
      const main=document.createElement("div");main.className="item-main";
      const dh=document.createElement("span");dh.className="drag-handle";dh.textContent="⠿";
      const code=document.createElement("span");code.className="item-code";code.textContent=item.code;
      const nw=document.createElement("div");nw.className="item-name-wrap";
      const ni=document.createElement("input");ni.className="item-name item-name-input";ni.id="name-"+item.id;ni.type="text";ni.value=item.name;
      ni.addEventListener("blur",()=>window.setName(item.id,ni.value));
      ni.addEventListener("keydown",e=>{if(e.key==="Enter")ni.blur();});
      nw.appendChild(ni);
      const badge=document.createElement("span");
      badge.className="status-badge"+(item.count===0?" badge-out":item.count<=low?" badge-low":" badge-ok");
      badge.textContent=item.count===0?"Sold Out":item.count<=low?"Low":"";
      const ci=document.createElement("input");
      ci.className="item-count count-input"+(item.count===0?" zero":item.count<=low?" low":"");
      ci.id="count-"+item.id;ci.type="number";ci.min="0";ci.max="999";ci.value=item.count;
      ci.setAttribute("inputmode","numeric");ci.setAttribute("pattern","[0-9]*");

      main.appendChild(dh);main.appendChild(code);main.appendChild(nw);main.appendChild(badge);main.appendChild(ci);
      card.appendChild(main);

      const pb=document.createElement("button");pb.className="ctrl-btn plus";pb.textContent="+";pb.addEventListener("click",()=>window.adjust(item.id,+1));

      ctrl.appendChild(mb);ctrl.appendChild(pb);ctrl.appendChild(db2);

}

window.enterReorderMode=function(){
  if(isReordering)return;
  isReordering=true;renderItems();
  document.getElementById("items-list").classList.add("reordering");
  const sl=document.getElementById("sortable-list");
  if(sl){sortableInstance=Sortable.create(sl,{handle:".drag-handle",animation:150,ghostClass:"sortable-ghost",chosenClass:"sortable-chosen"});}
  hapticLight();
};

window.exitReorderMode=async function(){
  if(sortableInstance){sortableInstance.destroy();sortableInstance=null;}
  await saveOrder();
  isReordering=false;
  document.getElementById("items-list")?.classList.remove("reordering");
  renderItems();
};

async function saveOrder(){
  const sl=document.getElementById("sortable-list");if(!sl)return;
  const orderedIds=[...sl.querySelectorAll("[data-item-id]")].map(el=>el.dataset.itemId);
  let newOrder=[];
  if(activeCat==="all"||activeCat==="uncategorised"){
    const inView=new Set(orderedIds);
    orderedIds.forEach((id,i)=>newOrder.push({id,sort_order:i}));
    items.filter(i=>!inView.has(i.id)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))
      .forEach((item,j)=>newOrder.push({id:item.id,sort_order:orderedIds.length+j}));
  }else{
    const newCatOrder=orderedIds.map(id=>items.find(i=>i.id===id)).filter(Boolean);
    let catIdx=0;
    const allSorted=[...items].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    const merged=allSorted.map(item=>item.category===activeCat?newCatOrder[catIdx++]||item:item);
    newOrder=merged.map((item,i)=>({id:item.id,sort_order:i}));
  }
  newOrder.forEach(({id,sort_order})=>{const item=items.find(i=>i.id===id);if(item)item.sort_order=sort_order;});
  try{
    const batch=writeBatch(db);
    newOrder.forEach(({id,sort_order})=>batch.update(doc(db,COL,id),{sort_order}));
    await batch.commit();showToast("Order saved ✓");
  }catch(e){showToast("Failed to save order");}
}

// ── CATEGORY MANAGER ─────────────────────────────────────────────────────────
window.openCatManager=function(){
  isCatMgrOpen=true;renderCatManager();renderNewCatEmojiGrid();
  document.getElementById("cat-modal").classList.add("open");hapticLight();
};

window.closeCatManager=function(){
  isCatMgrOpen=false;
  if(catSortableInstance){catSortableInstance.destroy();catSortableInstance=null;}
  document.getElementById("cat-modal").classList.remove("open");
  document.getElementById("cat-add-form").style.display="none";
  document.getElementById("cat-add-toggle-icon").textContent="+";
  document.getElementById("new-cat-name").value="";
};

window.handleCatOverlayClick=function(e){if(e.target===document.getElementById("cat-modal"))window.closeCatManager();};

function renderCatManager(){
  const list=document.getElementById("cat-mgr-list");if(!list)return;
  list.innerHTML="";
  cats.forEach(cat=>{
    const itemCount=items.filter(i=>i.category===cat.name).length;
    const canDel=cats.length>1;
    const row=document.createElement("div");row.className="cat-mgr-row";row.dataset.catId=cat.id;
    const drag=document.createElement("span");drag.className="cat-mgr-drag";drag.textContent="⠿";
    const icon=document.createElement("span");icon.className="cat-mgr-icon";icon.textContent=cat.icon;
    const name=document.createElement("span");name.className="cat-mgr-name";name.textContent=cat.name;
    const cnt=document.createElement("span");cnt.className="cat-mgr-count";cnt.textContent=itemCount+" item"+(itemCount!==1?"s":"");
    const ren=document.createElement("button");ren.className="cat-mgr-act rename";ren.textContent="Rename";ren.addEventListener("click",()=>window.startRenameCategory(cat.id));
    const del=document.createElement("button");del.className="cat-mgr-act delete";
    if(!canDel){del.disabled=true;del.textContent="—";}else{del.textContent="Delete";del.addEventListener("click",()=>window.deleteCategory(cat.id));}
    row.appendChild(drag);row.appendChild(icon);row.appendChild(name);row.appendChild(cnt);row.appendChild(ren);row.appendChild(del);
    list.appendChild(row);
  });
  if(catSortableInstance){catSortableInstance.destroy();catSortableInstance=null;}
  catSortableInstance=Sortable.create(list,{handle:".cat-mgr-drag",animation:150,onEnd:saveCatOrder});
}

function renderNewCatEmojiGrid(){
  const grid=document.getElementById("new-cat-emoji-grid");if(!grid)return;
  grid.innerHTML="";
  FOOD_EMOJIS.forEach(e=>{
    const opt=document.createElement("div");opt.className="emoji-opt"+(e===newCatEmoji?" sel":"");
    opt.textContent=e;
    opt.addEventListener("click",()=>{
      newCatEmoji=e;
      grid.querySelectorAll(".emoji-opt").forEach(o=>o.classList.remove("sel"));
      opt.classList.add("sel");
    });
    grid.appendChild(opt);
  });
}

window.startRenameCategory=function(catId){
  const cat=cats.find(c=>c.id===catId);if(!cat)return;
  renameEmojiTemp[catId]=cat.icon;
  const row=document.querySelector(".cat-mgr-row[data-cat-id='"+catId+"']");if(!row)return;
  // Clear and rebuild as rename row
  row.className="cat-mgr-row cat-rename-row";
  row.innerHTML="";
  const emojiBtn=document.createElement("span");emojiBtn.className="cat-emoji-btn";emojiBtn.id="rename-emoji-"+catId;emojiBtn.textContent=cat.icon;
  emojiBtn.addEventListener("click",()=>window.toggleRenameEmojiPicker(catId));
  const input=document.createElement("input");input.className="cat-rename-input";input.id="rename-input-"+catId;input.type="text";input.value=cat.name;input.maxLength=30;
  input.addEventListener("keydown",e=>{if(e.key==="Enter")window.saveRenameCategory(catId);if(e.key==="Escape")window.cancelRenameCategory(catId);});
  const saveBtn=document.createElement("button");saveBtn.className="cat-mgr-act save-rename";saveBtn.textContent="Save";saveBtn.addEventListener("click",()=>window.saveRenameCategory(catId));
  const cancelBtn=document.createElement("button");cancelBtn.className="cat-mgr-act cancel-rename";cancelBtn.textContent="✕";cancelBtn.addEventListener("click",()=>window.cancelRenameCategory(catId));
  row.appendChild(emojiBtn);row.appendChild(input);row.appendChild(saveBtn);row.appendChild(cancelBtn);
  setTimeout(()=>input.focus(),50);
};

window.toggleRenameEmojiPicker=function(catId){
  const existing=document.getElementById("emoji-picker-"+catId);if(existing){existing.remove();return;}
  const row=document.querySelector(".cat-mgr-row[data-cat-id='"+catId+"']");if(!row)return;
  const grid=document.createElement("div");grid.id="emoji-picker-"+catId;grid.className="emoji-picker-grid";
  FOOD_EMOJIS.forEach(e=>{
    const opt=document.createElement("div");opt.className="emoji-opt"+(e===renameEmojiTemp[catId]?" sel":"");opt.textContent=e;
    opt.addEventListener("click",()=>{
      renameEmojiTemp[catId]=e;
      const btn=document.getElementById("rename-emoji-"+catId);if(btn)btn.textContent=e;
      grid.querySelectorAll(".emoji-opt").forEach(o=>o.classList.remove("sel"));opt.classList.add("sel");
    });
    grid.appendChild(opt);
  });
  row.after(grid);
};

window.saveRenameCategory=async function(catId){
  const cat=cats.find(c=>c.id===catId);if(!cat)return;
  const input=document.getElementById("rename-input-"+catId);
  const newName=input?input.value.trim():"";
  if(!newName){showToast("Name cannot be empty");return;}
  document.getElementById("emoji-picker-"+catId)?.remove();
  const newIcon=renameEmojiTemp[catId]||cat.icon;
  const oldName=cat.name;
  const saveBtn=document.querySelector(".cat-mgr-row[data-cat-id='"+catId+"'] .save-rename");
  if(saveBtn){saveBtn.disabled=true;saveBtn.textContent="Saving…";}
  try{
    await updateDoc(doc(db,CATS_COL,catId),{name:newName,icon:newIcon});
    if(oldName!==newName){
      const affected=items.filter(i=>i.category===oldName);
      if(affected.length>0){
        const batch=writeBatch(db);
        affected.forEach(item=>batch.update(doc(db,COL,item.id),{category:newName}));
        await batch.commit();
        affected.forEach(item=>item.category=newName);
      }
    }
    if(activeCat===oldName)activeCat=newName;
    showToast("Category updated ✓");
  }catch(e){showToast("Failed to update category");}
};

window.cancelRenameCategory=function(catId){
  document.getElementById("emoji-picker-"+catId)?.remove();
  delete renameEmojiTemp[catId];
  renderCatManager();
};

window.deleteCategory=function(catId){
  const cat=cats.find(c=>c.id===catId);if(!cat)return;
  const row=document.querySelector(".cat-mgr-row[data-cat-id='"+catId+"']");if(!row)return;
  const existing=row.querySelector(".cat-delete-confirm");if(existing){existing.remove();return;}
  const itemCount=items.filter(i=>i.category===cat.name).length;
  const box=document.createElement("div");box.className="cat-delete-confirm";
  const msg=document.createElement("p");
  msg.textContent="⚠️ Delete \""+cat.name+"\"? "+(itemCount>0?itemCount+" item"+(itemCount!==1?"s":"")+" will become uncategorised.":"This category has no items.");
  const btns=document.createElement("div");btns.className="confirm-row";
  const yes=document.createElement("button");yes.className="confirm-yes";yes.textContent="Yes, delete";yes.addEventListener("click",()=>window.confirmDeleteCategory(catId));
  const no=document.createElement("button");no.className="confirm-no";no.textContent="Cancel";no.addEventListener("click",()=>box.remove());
  btns.appendChild(yes);btns.appendChild(no);
  box.appendChild(msg);box.appendChild(btns);
  row.appendChild(box);
};

window.confirmDeleteCategory=async function(catId){
  const cat=cats.find(c=>c.id===catId);if(!cat)return;
  const catName=cat.name;
  try{
    await deleteDoc(doc(db,CATS_COL,catId));
    const affected=items.filter(i=>i.category===catName);
    if(affected.length>0){
      const batch=writeBatch(db);
      affected.forEach(item=>batch.update(doc(db,COL,item.id),{category:null}));
      await batch.commit();
      affected.forEach(item=>item.category=null);
    }
    if(activeCat===catName)activeCat="all";
    showToast(catName+" deleted");renderCatBar();renderItems();
  }catch(e){showToast("Failed to delete category");}
};

async function saveCatOrder(){
  const list=document.getElementById("cat-mgr-list");if(!list)return;
  const batch=writeBatch(db);
  [...list.querySelectorAll("[data-cat-id]")].forEach((row,i)=>{
    const id=row.dataset.catId;
    const cat=cats.find(c=>c.id===id);if(cat)cat.sort_order=i;
    batch.update(doc(db,CATS_COL,id),{sort_order:i});
  });
  try{await batch.commit();}catch(e){showToast("Failed to save category order");}
}

window.toggleCatAddForm=function(){
  const form=document.getElementById("cat-add-form");
  const icon=document.getElementById("cat-add-toggle-icon");
  const open=form.style.display==="none";
  form.style.display=open?"block":"none";
  icon.textContent=open?"−":"+";
  if(open)setTimeout(()=>document.getElementById("new-cat-name")?.focus(),50);
};

window.addCategory=async function(){
  const name=document.getElementById("new-cat-name").value.trim();
  if(!name){showToast("Please enter a category name");return;}
  if(cats.find(c=>c.name===name)){showToast("Category already exists");return;}
  const btn=document.getElementById("btn-add-cat");btn.disabled=true;btn.textContent="Adding…";
  const maxO=cats.reduce((m,c)=>Math.max(m,c.sort_order||0),0);
  try{
    await addDoc(collection(db,CATS_COL),{name,icon:newCatEmoji,sort_order:maxO+1});
    document.getElementById("new-cat-name").value="";
    btn.disabled=false;btn.textContent="Add Category";showToast(name+" added ✓");
  }catch(e){btn.disabled=false;btn.textContent="Add Category";showToast("Failed: "+e.message);}
};

// ── ITEM CATEGORY PICKER ──────────────────────────────────────────────────────
window.toggleCatPicker=function(itemId,event){
  event.stopPropagation();
  document.querySelectorAll(".cat-picker-dropdown").forEach(el=>el.remove());
  const tagEl=document.querySelector(".cat-tag[data-item-id='"+itemId+"']");if(!tagEl)return;
  const row=tagEl.closest(".cat-tag-row");if(!row)return;
  const dropdown=document.createElement("div");dropdown.className="cat-picker-dropdown";
  cats.forEach(cat=>{
    const btn=document.createElement("button");btn.className="cat-picker-opt";
    btn.textContent=cat.icon+" "+cat.name;
    btn.addEventListener("click",e=>{e.stopPropagation();window.setItemCategory(itemId,cat.name);});
    dropdown.appendChild(btn);
  });
  const cancel=document.createElement("button");cancel.className="cat-picker-cancel";cancel.textContent="✕ Cancel";
  cancel.addEventListener("click",e=>{e.stopPropagation();dropdown.remove();});
  dropdown.appendChild(cancel);
  row.appendChild(dropdown);
  const closeHandler=e=>{if(!dropdown.contains(e.target)){dropdown.remove();document.removeEventListener("click",closeHandler);}};
  setTimeout(()=>document.addEventListener("click",closeHandler),0);
};

window.setItemCategory=async function(itemId,catName){
  document.querySelectorAll(".cat-picker-dropdown").forEach(el=>el.remove());
  const item=items.find(i=>i.id===itemId);if(!item)return;
  const oldCat=item.category;item.category=catName;
  const tagEl=document.querySelector(".cat-tag[data-item-id='"+itemId+"']");
  if(tagEl){
    const catObj=cats.find(c=>c.name===catName);
    if(catObj){tagEl.className="cat-tag";tagEl.textContent=catObj.icon+" "+catObj.name+" ›";}
  }
  renderCatBar();
  try{await updateDoc(doc(db,COL,itemId),{category:catName});showToast("→ "+catName+" ✓");}
  catch(e){item.category=oldCat;showToast("Failed to update category");renderItems();}
};
</script>
